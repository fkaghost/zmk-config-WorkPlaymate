# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Increase BLE transmit power.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Two host Bluetooth profiles + one reserved split slot.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# Device naming.
# ZMK v0.3 normally maps ZMK_KEYBOARD_NAME to BT_DEVICE_NAME automatically,
# but all relevant names are set explicitly here so there is no ambiguity.
CONFIG_ZMK_KEYBOARD_NAME="WorkPlaymate"
CONFIG_BT_DEVICE_NAME="WorkPlaymate"
CONFIG_BT_DIS_MODEL="WorkPlaymate"
CONFIG_USB_DEVICE_PRODUCT="WorkPlaymate"

# Enable eager debouncing.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio.
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment to enable USB logging.
# CONFIG_ZMK_USB_LOGGING=y
