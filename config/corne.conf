# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Limit this Corne central firmware to TWO host Bluetooth profiles.
#
# corne_left is compiled as the central side of a split keyboard, so ZMK
# reserves one BLE pairing/connection slot for the peripheral half.
# 2 host profiles + 1 reserved split slot = 3.
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# Enable ZMK Studio for Realtime Keymap Updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Uncomment the following line to enable USB Logging
# (this increases power usage by a significant amount)
# CONFIG_ZMK_USB_LOGGING=y
